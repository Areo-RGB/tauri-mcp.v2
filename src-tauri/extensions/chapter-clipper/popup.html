<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MCPHub Chapter Clipper</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header>
      <div><h1>Chapter Clipper</h1><p>Local MCPHub connection</p></div>
      <span id="status">Checking…</span>
    </header>
    <main>
      <div class="actions">
        <button id="check">Check connection</button>
        <button id="clear" class="secondary">Clear</button>
      </div>
      <section aria-label="Extension activity log"><ol id="logs"></ol></section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
